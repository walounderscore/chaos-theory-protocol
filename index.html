<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Chaos Theory Protocol - Artist Toolkit</title>
  <script src="coi-serviceworker.js"></script>
  <!-- Paystack Inline JS -->
  <script src="https://js.paystack.co/v2/inline.js"></script>
  <style>
    body { font-family: system-ui, sans-serif; background: #0d1117; color: #c9d1d9; padding: 2rem; }
    .card { border: 1px solid #30363d; border-radius: 8px; padding: 1.5rem; margin-bottom: 1rem; background: #161b22; }
    .locked { opacity: 0.4; pointer-events: none; }
    button { background: #238636; color: white; border: none; padding: 10px 16px; border-radius: 6px; cursor: pointer; }
    button:hover { background: #2ea043; }
  </style>
</head>
<body>
  <h1>Chaos Theory Protocol</h1>
  <p>Self-Hosted Audio Encryption & Direct Distribution Toolkit</p>

  <!-- Step 1: Intent & Verification Gate -->
  <div id="gate-card" class="card">
    <h3>1. Unlock Protocol Toolkit</h3>
    <p>A commitment fee of <b>₦100</b> is required to access local WebAssembly encryption & Drive tools.</p>
    <button id="pay-btn" onclick="payWithPaystack()">Unlock Toolkit (₦100)</button>
  </div>

  <!-- Step 2: Locked Workspace -->
  <div id="toolkit" class="locked">
    <div class="card">
      <h3>2. Drive Authorization & File Selection</h3>
      <button id="auth-btn">Connect Google Drive</button>
    </div>

    <div class="card">
      <h3>3. In-Browser Packaging (ffmpeg.wasm)</h3>
      <button id="encrypt-btn">Encrypt & Segment Track</button>
    </div>
  </div>

  <script>
    function payWithPaystack() {
      const email = prompt("Enter your artist email for transaction reference:");
      if (!email) return;

      const popup = new PaystackPop();
      popup.newTransaction({
        key: 'YOUR_PAYSTACK_PUBLIC_KEY', // Replace with your Paystack Public Key
        email: email,
        amount: 10000, // 100 NGN in kobo
        currency: 'NGN',
        onSuccess: function(transaction) {
          alert('Protocol Unlocked. Reference: ' + transaction.reference);
          document.getElementById('gate-card').style.display = 'none';
          document.getElementById('toolkit').classList.remove('locked');
        },
        onCancel: function() {
          alert('Commitment payment cancelled.');
        }
      });
    }
  </script>
</body>
</html>
